  <defs>
    <style>
      /* حالت لایت‌مود: کدهای رنگی دقیق و اصلی برند شما */
      .grad-top { stop-color: #85A947; }    /* سبز روشن اصیل */
      .grad-bottom { stop-color: #123524; } /* سبز تیره اصیل */

      /* حالت دارک‌مود: حفظ هویت رنگی و جلوگیری از نئونی شدن */
      /* صرفاً روشنایی رنگ تیره کمی بیشتر شده تا روی تب مشکی مرورگر خوانا بماند */
      @media (prefers-color-scheme: dark) {
        .grad-top { stop-color: #93B556; }    /* تناژ ملایم و کمی روشن‌تر از رنگ ثانویه */
        .grad-bottom { stop-color: #285635; } /* نسخه کمی روشن‌تر از رنگ تیره برای حفظ کنتراست */
      }
    </style>

    <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="grad-top" />
      <stop offset="100%" class="grad-bottom" />
    </linearGradient>
  </defs>

